<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 370" width="100%" height="370">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1423" />
      <stop offset="50%" stop-color="#141321" />
      <stop offset="100%" stop-color="#0b0e17" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#FE428E" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2135" />
      <stop offset="100%" stop-color="#16192b" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Card Background with Animated Neon Border -->
  <rect x="6" y="6" width="448" height="358" rx="14" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="2" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="80" cy="60" r="45" fill="#00F2FE" opacity="0.08">
    <animate attributeName="r" values="40;55;40" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="380" cy="300" r="55" fill="#FE428E" opacity="0.08">
    <animate attributeName="r" values="55;40;55" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Top Floating Tech Pills -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="700">
    <!-- Python Pill -->
    <g transform="translate(22, 16)">
      <rect width="88" height="22" rx="11" fill="#1a2238" stroke="#FFD43B" stroke-width="1.2" />
      <circle cx="14" cy="11" r="4" fill="#FFD43B">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15" fill="#FFD43B">Python 3.12</text>
    </g>

    <!-- PostgreSQL Pill -->
    <g transform="translate(118, 16)">
      <rect width="102" height="22" rx="11" fill="#1a2238" stroke="#00F2FE" stroke-width="1.2" />
      <circle cx="14" cy="11" r="4" fill="#00F2FE">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15" fill="#00F2FE">PostgreSQL</text>
    </g>

    <!-- FastAPI / React Pill -->
    <g transform="translate(228, 16)">
      <rect width="104" height="22" rx="11" fill="#1a2238" stroke="#00F5D4" stroke-width="1.2" />
      <circle cx="14" cy="11" r="4" fill="#00F5D4">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15" fill="#00F5D4">FastAPI · TS</text>
    </g>

    <!-- DevMake Pill -->
    <g transform="translate(340, 16)">
      <rect width="98" height="22" rx="11" fill="#1a2238" stroke="#FE428E" stroke-width="1.2" />
      <circle cx="14" cy="11" r="4" fill="#FE428E">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15" fill="#FE428E">DevMake AI</text>
    </g>
  </g>

  <!-- IDE Terminal Window -->
  <rect x="20" y="48" width="420" height="248" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <path d="M 20 58 Q 20 48 30 48 L 430 48 Q 440 48 440 58 L 440 76 L 20 76 Z" fill="url(#termHeader)" />

  <!-- Window Traffic Lights -->
  <circle cx="38" cy="62" r="5.5" fill="#FF5F56" />
  <circle cx="56" cy="62" r="5.5" fill="#FFBD2E" />
  <circle cx="74" cy="62" r="5.5" fill="#27C93F" />

  <!-- Terminal Tab Title -->
  <text x="235" y="66" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#8b949e">
    ⚡ jose_marin@devmake: ~/engine/architecture.py
  </text>

  <!-- Line Numbers -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="11.5" fill="#484f58" text-anchor="end">
    <text x="42" y="100">1</text>
    <text x="42" y="120">2</text>
    <text x="42" y="140">3</text>
    <text x="42" y="160">4</text>
    <text x="42" y="180">5</text>
    <text x="42" y="200">6</text>
    <text x="42" y="220">7</text>
    <text x="42" y="240">8</text>
    <text x="42" y="260">9</text>
    <text x="42" y="280">10</text>
  </g>

  <!-- Syntax Highlighted Code -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="11.5" font-weight="500">
    <!-- Line 1 -->
    <text x="54" y="100">
      <tspan fill="#FF7B72">from</tspan> <tspan fill="#79C0FF">devmake.core</tspan> <tspan fill="#FF7B72">import</tspan> <tspan fill="#FFA657">SoftwareArchitect</tspan>, <tspan fill="#FFA657">DataPipeline</tspan>
    </text>

    <!-- Line 2 -->
    <text x="54" y="120">
      <tspan fill="#FF7B72">class</tspan> <tspan fill="#D2A8FF" font-weight="700">JoseDavidMarin</tspan>(<tspan fill="#FFA657">SoftwareArchitect</tspan>):
    </text>

    <!-- Line 3 -->
    <text x="70" y="140">
      <tspan fill="#FF7B72">def</tspan> <tspan fill="#79C0FF">__init__</tspan>(<tspan fill="#FFA657">self</tspan>):
    </text>

    <!-- Line 4 -->
    <text x="86" y="160">
      <tspan fill="#FFA657">self</tspan>.role = <tspan fill="#A5D6FF">"Co-Founder @ DevMake &amp; Data/Backend Eng"</tspan>
    </text>

    <!-- Line 5 -->
    <text x="86" y="180">
      <tspan fill="#FFA657">self</tspan>.stack = [<tspan fill="#FFD43B">"Python"</tspan>, <tspan fill="#00F2FE">"PostgreSQL"</tspan>, <tspan fill="#00F5D4">"FastAPI"</tspan>, <tspan fill="#FE428E">"React/TS"</tspan>]
    </text>

    <!-- Line 6 -->
    <text x="86" y="200">
      <tspan fill="#FFA657">self</tspan>.erp = [<tspan fill="#A5D6FF">"Odoo v15-v20"</tspan>, <tspan fill="#A5D6FF">"TMS/RNDC"</tspan>, <tspan fill="#A5D6FF">"DIAN E-Invoicing"</tspan>]
    </text>

    <!-- Line 7 -->
    <text x="86" y="220">
      <tspan fill="#FFA657">self</tspan>.langs = {<tspan fill="#A5D6FF">"ES"</tspan>: <tspan fill="#39D353">"Native"</tspan>, <tspan fill="#A5D6FF">"EN"</tspan>: <tspan fill="#00F2FE">"C1 (London, UK)"</tspan>}
    </text>

    <!-- Line 8 -->
    <text x="70" y="240">
      <tspan fill="#FF7B72">async def</tspan> <tspan fill="#D2A8FF">deploy_production</tspan>(<tspan fill="#FFA657">self</tspan>, db: <tspan fill="#FFA657">DataPipeline</tspan>):
    </text>

    <!-- Line 9 -->
    <text x="86" y="260">
      <tspan fill="#FF7B72">await</tspan> db.execute(<tspan fill="#A5D6FF">"SELECT * FROM erp_tx FOR UPDATE"</tspan>)
    </text>

    <!-- Line 10 -->
    <text x="86" y="280">
      <tspan fill="#FF7B72">return</tspan> <tspan fill="#39D353">"🚀 High-Concurrency System Online"</tspan>
    </text>

    <!-- Blinking Cursor -->
    <rect x="336" y="269" width="7" height="14" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Live Telemetry / Architecture Pipeline Bar at Bottom -->
  <g transform="translate(20, 308)">
    <rect width="420" height="42" rx="9" fill="#121829" stroke="#23304d" stroke-width="1.2" />

    <!-- Animated Data Flow Line -->
    <line x1="25" y1="21" x2="395" y2="21" stroke="#1e293b" stroke-width="2" />
    <circle cx="25" cy="21" r="3.5" fill="#00F2FE" filter="url(#neonGlow)">
      <animate attributeName="cx" values="30;390;30" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 1: API / Webhooks -->
    <g transform="translate(16, 8)">
      <rect width="112" height="26" rx="6" fill="#0d1117" stroke="#00F2FE" stroke-width="1.2" />
      <circle cx="13" cy="13" r="3.5" fill="#39D353">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <text x="23" y="17" font-family="'Fira Code', Consolas, monospace" font-size="10" font-weight="700" fill="#E2F1FF">API · Webhooks</text>
    </g>

    <!-- Node 2: PostgreSQL ACID -->
    <g transform="translate(152, 8)">
      <rect width="116" height="26" rx="6" fill="#0d1117" stroke="#FE428E" stroke-width="1.2" />
      <circle cx="13" cy="13" r="3.5" fill="#FE428E">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <text x="23" y="17" font-family="'Fira Code', Consolas, monospace" font-size="10" font-weight="700" fill="#E2F1FF">Postgres ACID</text>
    </g>

    <!-- Node 3: AI & ERP Cloud -->
    <g transform="translate(292, 8)">
      <rect width="112" height="26" rx="6" fill="#0d1117" stroke="#00F5D4" stroke-width="1.2" />
      <circle cx="13" cy="13" r="3.5" fill="#00F5D4">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <text x="23" y="17" font-family="'Fira Code', Consolas, monospace" font-size="10" font-weight="700" fill="#E2F1FF">ERP &amp; AI Cloud</text>
    </g>
  </g>
</svg>
