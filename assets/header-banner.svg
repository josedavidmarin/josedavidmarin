<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="35%" stop-color="#151934" />
      <stop offset="70%" stop-color="#1e153a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FE428E" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FE428E" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2F1FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="50%" stop-color="#FE428E" stop-opacity="1" />
      <stop offset="75%" stop-color="#00F5D4" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Dark Background -->
  <rect width="1200" height="230" fill="url(#bgGrad)" rx="12" />

  <!-- Subtle Tech Grid Pattern -->
  <g stroke="#00F2FE" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="45" x2="1200" y2="45" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="150" y1="0" x2="150" y2="230" />
    <line x1="350" y1="0" x2="350" y2="230" />
    <line x1="600" y1="0" x2="600" y2="230" />
    <line x1="850" y1="0" x2="850" y2="230" />
    <line x1="1050" y1="0" x2="1050" y2="230" />
  </g>

  <!-- Twinkling Cyber Nodes / Stars -->
  <g fill="#00F2FE">
    <circle cx="95" cy="42" r="2.2" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="115" r="1.8" fill="#FE428E">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="48" r="2.5" fill="#00F5D4">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="970" cy="108" r="2" fill="#FFD43B">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="1135" cy="128" r="1.8" fill="#FE428E">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="65" cy="135" r="2" fill="#00F5D4">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Code Brackets in Background -->
  <text x="55" y="105" font-family="'Fira Code', Consolas, monospace" font-size="64" font-weight="800" fill="#00F2FE" opacity="0.08">&lt;/&gt;</text>
  <text x="1035" y="105" font-family="'Fira Code', Consolas, monospace" font-size="58" font-weight="800" fill="#FE428E" opacity="0.08">{ }</text>

  <!-- Animated Waving Layer 1 -->
  <path fill="url(#waveGrad1)" d="M 0 165 Q 300 120 600 165 T 1200 160 L 1200 230 L 0 230 Z">
    <animate attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
        M 0 165 Q 300 120 600 165 T 1200 160 L 1200 230 L 0 230 Z;
        M 0 155 Q 300 195 600 155 T 1200 175 L 1200 230 L 0 230 Z;
        M 0 165 Q 300 120 600 165 T 1200 160 L 1200 230 L 0 230 Z" />
  </path>

  <!-- Animated Waving Layer 2 -->
  <path fill="url(#waveGrad2)" d="M 0 182 Q 300 215 600 178 T 1200 185 L 1200 230 L 0 230 Z">
    <animate attributeName="d"
      dur="5.5s"
      repeatCount="indefinite"
      values="
        M 0 182 Q 300 215 600 178 T 1200 185 L 1200 230 L 0 230 Z;
        M 0 190 Q 300 145 600 188 T 1200 170 L 1200 230 L 0 230 Z;
        M 0 182 Q 300 215 600 178 T 1200 185 L 1200 230 L 0 230 Z" />
  </path>

  <!-- Main Name Heading -->
  <text x="600" y="86" text-anchor="middle" font-family="'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="1">
    Jose David Marin Giraldo
  </text>

  <!-- Glowing Divider Bar -->
  <rect x="280" y="102" width="640" height="2.5" fill="url(#accentLine)" rx="1.5" />

  <!-- Subtitle / Role Description -->
  <text x="600" y="132" text-anchor="middle" font-family="'Fira Code', 'Segoe UI', Roboto, monospace" font-size="16.5" font-weight="600" fill="#A9FEF7" letter-spacing="0.5">
    Co-Founder @ DevMake  |  Ingeniería de Sistemas UTP  |  Backend, Data &amp; ERP Architecture
  </text>
</svg>
